# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync

on:
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `secrets.*` cannot be read in a step `if:`; expose presence via env so a
    # repo without the propagated secret skips cleanly instead of going red.
    env:
      FARM_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN }}
    steps:
      - name: Skip notice (secret not propagated)
        if: env.FARM_DISPATCH_TOKEN == ''
        run: echo "::notice::FARM_DISPATCH_TOKEN is not set for this repo; forge propagation skipped."

      - name: Trigger Propagation
        if: env.FARM_DISPATCH_TOKEN != ''
        # Third-party action: SHA-pinned in the workflow as well as in actions.lock.
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ env.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }

      - name: Confirm
        if: env.FARM_DISPATCH_TOKEN != ''
        run: echo "::notice::Propagation triggered for ${{ github.event.repository.name }}"
