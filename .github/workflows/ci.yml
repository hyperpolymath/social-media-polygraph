# -----------------------------------------------------------------
# This workflow used to run three more jobs. All three were removed on purpose,
# not muted. In 223 runs, from the import on 2026-04-26 to the retirement,
# neither test job ever passed. (Measured with
# `gh api repos/:owner/:repo/actions/workflows/ci.yml/runs?status=success`
# -> total_count 0.)
#
# * `Backend Tests`: RETIRED. It ran Poetry + black + ruff + mypy + pytest on
#   `backend/app` and `backend/tests`. Those paths and `backend/pyproject.toml`
#   have never existed in this repository. The backend is a Rust crate
#   (`backend/Cargo.toml`) and has been since the 2026-04-26 import. Estate
#   language policy also bans Python outright, so the job cannot be "fixed" as
#   written. It died at `poetry install` with exit code 1 on every run.
#   No equivalent Rust job is wired here yet. `backend/` does not compile today:
#   it has placeholder bodies, undefined types and phantom `[[bench]]` targets.
#   A Rust CI job added now would be red by construction. See issue #110 for
#   the follow-up decision.
#
# * `Frontend Tests`: RETIRED. It ran `npm ci` / lint / type-check / build
#   against `frontend/package-lock.json` and npm scripts. npm is banned by
#   estate policy. `package.json` was removed in #35 (npm -> Deno), `deno.json`
#   in #85, and the ReScript sources were replaced in #84 by five AffineScript
#   stubs (`frontend/src/**/*.affine`, each just a module line and a placeholder
#   comment). There is no
#   manifest, no lockfile it could resolve and no buildable frontend. It died in
#   `actions/setup-node` with "Some specified paths were not resolved, unable to
#   cache dependencies." When the AffineScript frontend has real code, gate it
#   with the canonical AffineScript compiler (see
#   hyperpolymath/standards .github/workflows/affinescript-verify.yml).
#
# * `Build Containers`: RETIRED with the two jobs above. It depended on them
#   (`needs:`), so it never actually ran. It could not pass anyway:
#   `frontend/Containerfile` copies package.json, bsconfig.json, deno.json,
#   public/ and nginx.conf, none of which exist, and `backend/Containerfile`
#   builds the non-compiling crate. Re-add it once both images can build.
#   `deploy.yml` (tag-triggered, no tags exist yet) has the same dependency.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  actions: read
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `upload-sarif` writes to the Code Scanning API and needs
    # `security-events: write`. With only the workflow-level `contents: read`,
    # this job has been red on every push to `main` since at least 2026-09-20
    # with "Resource not accessible by integration". The action's own warning
    # names the missing `security-events` permission. Scoped to this job, not
    # granted workflow-wide.
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master (untagged; newer than v0.36.0)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: 'trivy-results.sarif'
